name: Finder browser regressions

on:
  pull_request:
    paths:
      - 'src/pages/iskalnik-tekov.astro'
      - 'src/pages/en/find-races.astro'
      - 'src/utils-finder-url-state.ts'
      - 'src/utils-finder-active-filters.ts'
      - 'src/styles/global.css'
      - 'tests/browser/finder.spec.ts'
      - 'tests/browser/finder-nearby-pilot.spec.ts'
      - 'tests/browser/finder-nearby-integration.spec.ts'
      - 'tests/dev056-private-astro.config.mjs'
      - 'tests/browser/finder-nearby-release.spec.ts'
      - 'playwright.dev056-release.config.ts'
      - 'src/finder/dev056-first-release-index.ts'
      - 'playwright.dev056.config.ts'
      - 'src/finder/race-finder-controller.ts'
      - 'src/finder/race-finder-nearby-ui.ts'
      - 'src/utils-nearby-races.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finder-browser-regressions.yml'

jobs:
  finder-browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run finder browser regressions
        run: npm run test:browser:finder

      - name: Run DEV-056 private card integration (never deploy)
        run: npm run test:browser:nearby-private

      - name: Run DEV-056 actual reviewed pilot index privately (never deploy)
        run: npm run test:browser:nearby-release

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  dev056-wikidata-research:
    # Never executes on main/production; only development PR's non-production branch.
    if: github.event_name == 'pull_request' && github.head_ref == 'work/dev056-p1-nearby-core'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Wikidata read-only (no public index writes)
        run: node scripts/dev056-wikidata-probe.mjs
      - name: Upload unapproved candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev056-wikidata-research-not-approved
          path: research/out/dev056-wikidata-probe.generated.json
          if-no-files-found: warn
